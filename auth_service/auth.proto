syntax = "proto3";

package auth;

// Enum for user roles aligned with DB enum user_role
enum UserRole {
  USER = 0;
  ADMIN = 1;
}

// Enum for user status aligned with DB enum user_status
enum UserStatus {
  PENDING_VERIFICATION = 0;
  PENDING_APPROVAL = 1;
  ACTIVE = 2;
  SUSPENDED = 3;
}

// Supported OAuth providers
enum OAuthProvider {
  OAUTH_PROVIDER_UNSPECIFIED = 0;
  GOOGLE = 1;
  GITHUB = 2;
  MICROSOFT = 3;
}

// Service
service AuthService {
  rpc RegisterUser(RegisterUserRequest) returns (AuthResponse);
  rpc RegisterAdmin(RegisterAdminRequest) returns (AuthResponse);
  rpc VerifyAccountWithOTP(VerifyOTPRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc CheckUsername(CheckUsernameRequest) returns (CheckUsernameResponse);
  rpc ForgotPassword(ForgotPasswordRequest) returns (AuthResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (AuthResponse);
  rpc GetPendingAdmins(EmptyRequest) returns (AdminListResponse);
  rpc ApproveAdmin(AdminApprovalRequest) returns (AuthResponse);
  rpc SuspendUser(UserActionRequest) returns (AuthResponse);
  rpc UnsuspendUser(UserActionRequest) returns (AuthResponse);

  // OAuth login endpoint
  rpc LoginWithOAuth(LoginWithOAuthRequest) returns (LoginResponse);
}

// Generic response used for many RPCs
message AuthResponse {
  bool success = 1;
  string message = 2;
}

// Empty request for calls needing no parameters
message EmptyRequest {}

// --- Registration Messages ---
message RegisterUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string phone_number = 4; // empty string if omitted
}

message RegisterAdminRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string full_name = 4;
  string employee_id = 5; // empty string if omitted
  string admin_request_reason = 6;
}

// --- Verification & Login Messages ---
message VerifyOTPRequest {
  string email = 1;
  string otp_code = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  string token = 3;
  string user_id = 4;
  UserRole role = 5;
  string username = 6; // MODIFIED: Added username
  string email = 7;    // MODIFIED: Added email
}

// OAuth login request (ID token or access token from provider)
message LoginWithOAuthRequest {
  OAuthProvider provider = 1;
  string id_token = 2;
  string access_token = 3;
  string email_fallback = 4;
  string avatar_url = 5;
  string full_name = 6;
}

// --- Account Management Messages ---
message CheckUsernameRequest {
  string username = 1;
}

message CheckUsernameResponse {
  bool is_available = 1;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string email = 2;
  string new_password = 3;
}

// --- Admin Management Messages ---
message AdminUser {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string full_name = 4;
  string admin_request_reason = 5;
  string created_at = 6; // RFC3339 timestamp string
}

message AdminListResponse {
  repeated AdminUser admins = 1;
}

// auth_service/auth.proto

message AdminApprovalRequest {
  string user_id = 1;
  int32 expiry_days = 2; // ADD THIS LINE: 0 or negative means no expiry
}

message UserActionRequest {
  string user_id = 1;
  string reason = 2; // optional, empty string if omitted
}
// auth_service/auth.proto

